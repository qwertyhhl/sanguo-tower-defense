<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>三国守城</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1 id="game-title">三国守城</h1>

  <!-- 顶部状态栏 -->
  <div id="hud">
    <span class="hud-item">状态：<b id="hud-phase">准备中</b></span>
    <span class="hud-item">粮草：<b id="hud-grain">150</b></span>
    <button id="btn-start" type="button">开始守城</button>
  </div>

  <canvas id="gameCanvas" width="960" height="540"></canvas>

  <!-- 底部部署栏（M2 测试用：直接从这拖单位上场；M3 换成商店+背包） -->
  <div id="deploy-bar"></div>
  <div id="deploy-hint">按住下面的单位拖到地图上：塔放草地格，士兵放路上</div>

  <!-- 引入顺序很重要：config → map → main -->
  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
