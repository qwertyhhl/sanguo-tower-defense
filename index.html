<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>三国守城</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1 id="game-title">三国守城</h1>

  <!-- 顶部状态栏 -->
  <div id="hud">
    <span class="hud-item">波次：<b id="hud-wave">0/10</b></span>
    <span class="hud-item">粮草：<b id="hud-grain">100</b></span>
    <span class="hud-item">人口：<b id="hud-pop">0/20</b></span>
    <span class="hud-item">状态：<b id="hud-phase">准备中</b></span>
    <button id="btn-start" type="button">开始守城</button>
  </div>

  <canvas id="gameCanvas" width="960" height="540"></canvas>

  <!-- 商店：云顶式 5 件 + 刷新 + 锁定 -->
  <div id="shop-panel">
    <div id="shop-items"></div>
    <div id="shop-buttons">
      <button id="btn-refresh" type="button">刷新商店（10 粮草）</button>
      <button id="btn-lock" type="button">锁定商店</button>
    </div>
  </div>

  <!-- 背包：5 格 -->
  <div id="inventory-bar"></div>

  <!-- 出售区：拖单位到这里卖掉换粮草 -->
  <div id="sell-zone">出售区：把背包或场上的单位拖到这里卖掉换粮草（1级=造价，2级=2倍造价…）</div>
  <div id="deploy-hint">商店每波自动刷新（可锁定）→ 买单位进背包 → 拖到地图部署；同类型同等级拖一起合成升级</div>

  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
