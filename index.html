<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>三国守城</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 标题并入状态栏，节省高度 -->
  <div id="hud">
    <span class="hud-title">三国守城</span>
    <span class="hud-item">波次：<b id="hud-wave">0/10</b></span>
    <span class="hud-item">粮草：<b id="hud-grain">100</b></span>
    <span class="hud-item">人口：<b id="hud-pop">0/20</b></span>
    <span class="hud-item">状态：<b id="hud-phase">准备中</b></span>
    <button id="btn-start" type="button">开始守城</button>
  </div>

  <!-- 战场画布（宽 736 = 面板宽，16×9，每格 46px） -->
  <canvas id="gameCanvas" width="736" height="414"></canvas>

  <!-- 战备台：宽度与地图一致：棋子 → 刷新/锁定 → 出售区，下接背包 -->
  <div id="control-panel">
    <div id="cp-row1">
      <div id="shop-items"></div>
      <div id="shop-buttons">
        <button id="btn-refresh" type="button">刷新（10 粮草）</button>
        <button id="btn-lock" type="button">锁定</button>
      </div>
      <div id="sell-zone"><div class="sz-title">出 售 区</div></div>
    </div>
    <div class="cp-divider"></div>
    <div id="cp-inv">
      <div id="inventory-bar"></div>
    </div>
  </div>

  <!-- 悬浮提示（不占页面高度） -->
  <div id="deploy-hint"></div>

  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
