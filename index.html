<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>三国守城</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1 id="game-title">三国守城</h1>

  <!-- 顶部状态栏（M1：先显示城门耐久 / 敌军数量） -->
  <div id="hud">
    <span class="hud-item">状态：<b id="hud-phase">准备中</b></span>
    <button id="btn-start" type="button">开始守城</button>
  </div>

  <canvas id="gameCanvas" width="960" height="540"></canvas>

  <!-- 引入顺序很重要：config → map → main -->
  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
