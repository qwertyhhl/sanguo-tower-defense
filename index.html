<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>三国守城</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1 id="game-title">三国守城</h1>

  <!-- 顶部状态栏 -->
  <div id="hud">
    <span class="hud-item">波次：<b id="hud-wave">0/10</b></span>
    <span class="hud-item">粮草：<b id="hud-grain">100</b></span>
    <span class="hud-item">人口：<b id="hud-pop">0/20</b></span>
    <span class="hud-item">状态：<b id="hud-phase">准备中</b></span>
    <button id="btn-start" type="button">开始守城</button>
  </div>

  <!-- 战场画布 -->
  <canvas id="gameCanvas" width="640" height="360"></canvas>

  <!-- 战备台：棋子 → 刷新/锁定 → 出售区，下接背包 -->
  <div id="control-panel">
    <div id="cp-row1">
      <div id="shop-items"></div>
      <div id="shop-buttons">
        <button id="btn-refresh" type="button">刷新（10 粮草）</button>
        <button id="btn-lock" type="button">锁定</button>
      </div>
      <div id="sell-zone"><div class="sz-title">出 售 区</div></div>
    </div>
    <div class="cp-divider"></div>
    <div id="cp-inv">
      <div id="inventory-bar"></div>
    </div>
  </div>

  <div id="deploy-hint">买单位 → 拖上战场（塔/农民放草地，士兵放路上）；同类型同等级拖一起 = 合成升级</div>

  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
